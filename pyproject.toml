[project]
name = "pg-mcp"
version = "0.1.0"
description = "Read-only PostgreSQL MCP server for Claude Code and other MCP clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pg-mcp contributors" }]
keywords = ["mcp", "postgresql", "postgres", "claude", "llm", "readonly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.27,<2",
    "psycopg[binary,pool]>=3.3,<4",
    "pglast>=7,<8",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "testcontainers[postgres]>=4",
    "types-PyYAML",
]

[project.scripts]
pg-mcp = "pg_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/rakeshpatil/pg-mcp"
Issues = "https://github.com/rakeshpatil/pg-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles
    "B008",  # function call in default arg (FastMCP decorator pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]  # relax naming in tests

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Strict typing on the safety boundary and core runner
module = ["pg_mcp.safety", "pg_mcp.runner", "pg_mcp.config"]
strict = true

[[tool.mypy.overrides]]
module = ["pglast.*", "psycopg_pool.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running Postgres (skipped unless PG_MCP_TEST_DSN is set)",
    "e2e: end-to-end tests launching the server as a subprocess",
]

[tool.coverage.run]
source = ["src/pg_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
